name: Desktop checks
on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'apps/api/src/opendirector_api/**'
      - 'packages/core/src/opendirector/**'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shell:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts --prefix apps/desktop
      - run: npm test --prefix apps/desktop

  windows-full-verification:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run Python desktop, reference-media, and agent harness tests
        env:
          PYTHONPATH: apps/api/src;packages/core/src
        run: python -m pytest tests/test_desktop_host.py tests/test_reference_assets.py tests/test_agent_plan_and_undo.py tests/test_layer_boundary.py -q
      - name: Build frontend and check bilingual i18n
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run check:i18n
          npm test
